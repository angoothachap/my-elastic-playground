apiVersion: v1
kind: Secret
metadata:
  name: elastic-license
  namespace: elastic-system
stringData:
  license.json: |
    {"license":{"uid":"2c1e82db-5e98-4a9e-a66c-4f37e28e726c","type":"enterprise","issue_date_in_millis":1732060800000,"expiry_date_in_millis":1798761599999,"max_nodes":null,"max_resource_units":250,"issued_to":"Elastic - INTERNAL","issuer":"API","signature":"","start_date_in_millis":1732060800000}}
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-system
spec:
  version: 9.3.2
  secureSettings:
  - secretName: elastic-license
  nodeSets:
  # Data nodes - master, data, ingest roles
  - name: default
    count: 3
    config:
      node.store.allow_mmap: false
      node.roles: ["master", "data", "ingest"]
      xpack.security.enabled: true
      xpack.security.authc.api_key.enabled: true
    podTemplate:
      spec:
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 2Gi
              cpu: 1
            limits:
              memory: 2Gi
              cpu: 2
          env:
          - name: ES_JAVA_OPTS
            value: "-Xms1g -Xmx1g"
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard

  # ML nodes - dedicated for ELSER and machine learning tasks
  - name: ml
    count: 1
    config:
      node.store.allow_mmap: false
      node.roles: ["ml", "remote_cluster_client"]
      xpack.ml.max_machine_memory_percent: 90
      xpack.ml.use_auto_machine_memory_percent: true
      xpack.security.enabled: true
      xpack.security.authc.api_key.enabled: true
    podTemplate:
      spec:
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 8Gi
              cpu: 2
            limits:
              memory: 8Gi
              cpu: 4
          env:
          - name: ES_JAVA_OPTS
            value: "-Xms3g -Xmx3g"
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: standard

  http:
    tls:
      selfSignedCertificate:
        disabled: false
