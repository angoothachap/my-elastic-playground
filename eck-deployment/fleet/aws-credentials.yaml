---
# AWS credentials for CloudTrail integration.
# Replace the placeholder values with your actual base64-encoded credentials:
#   echo -n 'YOUR_ACCESS_KEY_ID' | base64
#   echo -n 'YOUR_SECRET_ACCESS_KEY' | base64
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: elastic-system
type: Opaque
data:
  access_key_id: REPLACE_WITH_BASE64_ACCESS_KEY_ID
  secret_access_key: REPLACE_WITH_BASE64_SECRET_ACCESS_KEY
